services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000}
      - INSTAGRAM_PROXY=${INSTAGRAM_PROXY:-}   # pass residential proxy from host env
    volumes:
      # Mount repo root so live edits to .py files are reflected without rebuild
      - .:/app
      # Persist encrypted session files across container restarts
      - ./backend/.sessions:/app/backend/.sessions
    restart: unless-stopped
